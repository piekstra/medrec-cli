[package]
name = "medrec-cli"
description = "A household's medical records in a plain Drive folder: people, intake of scans and files with local OCR, imaging studies, provider and insurer imports, timelines, search and notes."
version = "0.1.1"
edition = "2021"
# pk-cli-drive needs 1.89 (`File::lock`).
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piekstra/medrec-cli"
homepage = "https://github.com/piekstra/medrec-cli"
authors = ["piekstra"]
publish = false

[lib]
name = "medrec"
path = "src/lib.rs"

[[bin]]
name = "medrec"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.1" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.1" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.1" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.1" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.1" }
pk-cli-drive = { git = "https://github.com/piekstra/cli-common", tag = "v0.31.1" }
pk-med-records = { git = "https://github.com/piekstra/medical-common", tag = "v0.2.0" }
sha2 = "0.10"
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
regex = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
opt-level = 3
